[workspace]
resolver = "2"
members = [
    "crates/observer-core",
    "crates/observer-node",
    "crates/crypto-signing",
    "crates/policy-engine",
    "crates/capability-broker",
    "crates/residual-engine",
    "crates/proof-store",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = "2"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
thiserror = "1"
prost = "0.13"
prost-types = "0.13"
tonic = "0.12"
url = "2"
qrcode = { version = "0.14", default-features = false }
serde_yaml = "0.9"
regex = "1"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Open Architecture"
repository = "https://github.com/TheInnerI/inner-i-universal-observer"
